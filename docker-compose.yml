version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ev_charging_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ev_charging_password
      POSTGRES_DB: ev_charging
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: ev_charging_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
